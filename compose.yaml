name: lined

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${LINED_POSTGRES_DB:-lineddb}"
      POSTGRES_USER: "${LINED_POSTGRES_USER:-lined}"
      POSTGRES_PASSWORD: "${LINED_POSTGRES_PASSWORD:-lined}"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${LINED_MAILPIT_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend/lined
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${LINED_POSTGRES_DB:-lineddb}?options=-c%20TimeZone=UTC"
      SPRING_DATASOURCE_USERNAME: "${LINED_POSTGRES_USER:-lined}"
      SPRING_DATASOURCE_PASSWORD: "${LINED_POSTGRES_PASSWORD:-lined}"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FEATURE_FLAG_ENVIRONMENT: LOCAL
      # These credentials are intentionally deterministic and LOCAL-ONLY.
      LINED_JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      LINED_PASSWORD_RESET_TOKEN_SECRET: lined-local-password-reset-secret-2026
      LINED_MAIL_ENABLED: "true"
      LINED_MAIL_HOST: mailpit
      LINED_MAIL_PORT: 1025
      LINED_MAIL_FROM: no-reply@lined.local
      LINED_MAIL_TLS_ENABLED: "false"
      LINED_WEB_BASE_URL: https://localhost
      LINED_SECURITY_REFRESH_COOKIE_SECURE: "true"
      OTEL_SDK_DISABLED: "true"
    ports:
      - "${LINED_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./lined-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_ENABLE_MSW: "false"
        VITE_USE_MOCKS: "false"
    ports:
      - "${LINED_HTTP_PORT:-80}:80"
      - "${LINED_HTTPS_PORT:-443}:443"
    volumes:
      - ./.lined/tls/localhost.pem:/etc/nginx/tls/localhost.pem:ro
      - ./.lined/tls/localhost-key.pem:/etc/nginx/tls/localhost-key.pem:ro
    depends_on:
      - backend

volumes:
  postgres-data:
