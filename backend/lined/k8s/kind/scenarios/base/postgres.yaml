apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lined-postgres-data
  labels:
    app.kubernetes.io/name: lined-postgres
    app.kubernetes.io/part-of: lined
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lined-postgres
  labels:
    app.kubernetes.io/name: lined-postgres
    app.kubernetes.io/part-of: lined
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: lined-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lined-postgres
  labels:
    app.kubernetes.io/name: lined-postgres
    app.kubernetes.io/part-of: lined
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lined-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lined-postgres
        app.kubernetes.io/part-of: lined
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lined-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lined-postgres
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lined-postgres
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: UTC
            - name: PGTZ
              value: UTC
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lined-postgres-data
