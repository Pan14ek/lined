apiVersion: v1
kind: Service
metadata:
  name: lined-backend
  labels:
    app.kubernetes.io/name: lined-backend
    app.kubernetes.io/part-of: lined
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: lined-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lined-backend
  labels:
    app.kubernetes.io/name: lined-backend
    app.kubernetes.io/part-of: lined
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lined-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lined-backend
        app.kubernetes.io/part-of: lined
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: lined-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://lined-postgres:5432/lineddb?options=-c%20TimeZone=UTC
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lined-postgres
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lined-postgres
                  key: password
            - name: LINED_PASSWORD_RESET_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: lined-auth
                  key: reset-token-secret
            - name: OTEL_SDK_DISABLED
              value: "true"
