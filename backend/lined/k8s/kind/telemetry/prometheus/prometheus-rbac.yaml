apiVersion: v1
kind: ServiceAccount
metadata:
  name: lined-prometheus
  labels:
    app.kubernetes.io/name: lined-prometheus
    app.kubernetes.io/part-of: lined
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lined-prometheus-pod-discovery
  labels:
    app.kubernetes.io/name: lined-prometheus
    app.kubernetes.io/part-of: lined
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lined-prometheus-pod-discovery
  labels:
    app.kubernetes.io/name: lined-prometheus
    app.kubernetes.io/part-of: lined
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lined-prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: lined-prometheus
    namespace: lined
