spring.application.name=lined-backend
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics,prometheus,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=lined-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.sla.http.server.requests=100ms,200ms,500ms,1s,2s,5s
otel.exporter.otlp.endpoint=http://localhost:4317
otel.resource.attributes=service.name=lined-backend,service.version=0.1.0
spring.datasource.url=jdbc:postgresql://localhost:5432/lineddb?options=-c%20TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.io.backend=DEBUG
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
lined.feature-flags.environment=${FEATURE_FLAG_ENVIRONMENT:local}
lined.feature-flags.refresh-delay=${FEATURE_FLAG_REFRESH_DELAY:PT30M}
lined.security.jwt.issuer=lined
lined.security.jwt.audience=lined-api
lined.security.jwt.access-token-ttl=PT15M
lined.security.jwt.clock-skew=PT1M
lined.security.jwt.secret=${LINED_JWT_SECRET:}
lined.auth.reset-token-secret=${LINED_PASSWORD_RESET_TOKEN_SECRET:}
lined.security.session.refresh-idle-timeout=PT168H
lined.security.session.absolute-timeout=PT720H
lined.security.cookie.refresh-name=lined_refresh
lined.security.cookie.secure=${LINED_SECURITY_REFRESH_COOKIE_SECURE:true}
lined.security.cookie.same-site=Lax
lined.security.cookie.path=/api/auth
lined.security.cookie.enforce-secure=false
lined.security.cors.allow-credentials=true
lined.security.cors.allowed-origins=${LINED_SECURITY_CORS_ALLOWED_ORIGINS:}
lined.security.cors.require-https=false
# --- Server ---
server.forward-headers-strategy=framework
