spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lineddb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    clean-disabled: true
    fail-on-missing-locations: true
