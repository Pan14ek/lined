spring.config.activate.on-profile=prod

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.level.io.backend=INFO
logging.level.org.springframework.security=INFO

lined.security.cookie.enforce-secure=true
lined.security.cors.require-https=true

lined.auth.mail.enabled=${LINED_MAIL_ENABLED:true}
lined.auth.mail.frontend-base-url=${LINED_WEB_BASE_URL:}
lined.auth.mail.host=${LINED_MAIL_HOST:}
lined.auth.mail.port=${LINED_MAIL_PORT:1025}
lined.auth.mail.username=${LINED_MAIL_USERNAME:}
lined.auth.mail.password=${LINED_MAIL_PASSWORD:}
lined.auth.mail.from=${LINED_MAIL_FROM:}
lined.auth.mail.tls-enabled=${LINED_MAIL_TLS_ENABLED:true}
lined.auth.mail.require-https=true
lined.auth.mail.require-credentials=true
