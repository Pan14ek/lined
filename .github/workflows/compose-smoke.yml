name: Local Compose smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral CI TLS certificate
        run: |
          set -euo pipefail
          mkdir -p .lined/tls
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout .lined/tls/localhost-key.pem \
            -out .lined/tls/localhost.pem \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1'

      - name: Build Compose images
        run: docker compose build

      - name: Start Compose stack
        run: docker compose up -d

      - name: Wait for Compose readiness and verify routing
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if docker compose exec -T postgres pg_isready -U lined -d lineddb >/dev/null 2>&1 \
              && curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null \
              && curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null \
              && curl --fail --silent --insecure https://127.0.0.1/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo 'Compose services did not become ready.' >&2
              exit 1
            fi
            sleep 2
          done
          api_status=$(curl --silent --show-error --insecure --output /dev/null \
            --write-out '%{http_code}' https://127.0.0.1/api/users/me)
          case "$api_status" in
            401|403) ;;
            *) echo "Expected proxied unauthenticated API response, got HTTP $api_status." >&2; exit 1 ;;
          esac

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
