name: CI backend pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/lined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Run static checks (Checkstyle + SpotBugs + Tests)
        run: ./gradlew check

      - name: Generate code coverage report
        run: ./gradlew jacocoTestReport

      - name: Build and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonarqube --info -Dsonar.login=$SONAR_TOKEN
  reviewdog-checkstyle:
    name: Checkstyle reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Run Checkstyle
        working-directory: backend/lined
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Report Checkstyle with reviewdog
        uses: reviewdog/action-reviewdog@v5
        with:
          name: checkstyle
          reporter: github-pr-review
          tool_name: checkstyle
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning
          filter_mode: nofilter
          fail_on_error: false
          working_directory: backend/lined
          input: cat backend/lined/build/reports/checkstyle/main.xml
          format: checkstyle


  reviewdog-spotbugs:
    name: SpotBugs reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Run SpotBugs
        working-directory: backend/lined
        run: ./gradlew spotbugsMain spotbugsTest

      - name: ReviewDog SpotBugs Reporter
        uses: reviewdog/action-spotbugs@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_on_error: false
          spotbugs_input: backend/lined/build/reports/spotbugs/main.xml
