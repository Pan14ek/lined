name: CI backend pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  id-token: write

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      AWS_METRICS_REGION: ${{ secrets.AWS_METRICS_REGION }}
      AWS_METRICS_TABLE_NAME: ${{ secrets.AWS_METRICS_TABLE_NAME }}
      AWS_METRICS_PR_READ_ROLE_ARN: ${{ secrets.AWS_METRICS_PR_READ_ROLE_ARN }}
      AWS_METRICS_MAIN_WRITE_ROLE_ARN: ${{ secrets.AWS_METRICS_MAIN_WRITE_ROLE_ARN }}

    defaults:
      run:
        working-directory: backend/lined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lined-web/package-lock.json

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Run static checks (Checkstyle + SpotBugs + Tests)
        run: ./gradlew check

      - name: Run PostgreSQL API integration tests
        run: ./gradlew integrationTest

      - name: Generate code coverage report
        run: ./gradlew jacocoTestReport

      - name: Install web dependencies
        working-directory: lined-web
        run: npm ci

      - name: Lint web application
        working-directory: lined-web
        run: npm run lint

      - name: Typecheck web application
        working-directory: lined-web
        run: npm run typecheck

      - name: Test web application
        working-directory: lined-web
        run: npm run test:run

      - name: Build web application
        working-directory: lined-web
        run: npm run build

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonarqube --info -Dsonar.login=$SONAR_TOKEN

      - name: Upload reports (JaCoCo + Checkstyle + SpotBugs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/lined/build/reports/jacoco/**
            backend/lined/build/reports/checkstyle/**
            backend/lined/build/reports/spotbugs/**
            backend/lined/build/jacoco/*.exec
          if-no-files-found: warn
          retention-days: 14

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Upload SpotBugs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/lined/build/reports/spotbugs/spotbugsMain.sarif

      - name: Annotate Checkstyle via reviewdog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reviewdog -f=checkstyle \
            -name="checkstyle" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-on-error=true \
            < build/reports/checkstyle/main.xml

      - name: Install metrics collector deps
        working-directory: fitness-metrics-collector
        run: npm ci

      - name: Configure AWS credentials for pull-request metrics
        if: github.event_name == 'pull_request' && env.AWS_METRICS_PR_READ_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_METRICS_REGION }}
          role-to-assume: ${{ env.AWS_METRICS_PR_READ_ROLE_ARN }}
          role-session-name: lined-metrics-pr-${{ github.run_id }}

      - name: Configure AWS credentials for main metrics
        if: github.event_name != 'pull_request' && env.AWS_METRICS_MAIN_WRITE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_METRICS_REGION }}
          role-to-assume: ${{ env.AWS_METRICS_MAIN_WRITE_ROLE_ARN }}
          role-session-name: lined-metrics-main-${{ github.run_id }}

      - name: Collect metrics
        working-directory: fitness-metrics-collector
        env:
          CHECKSTYLE_XML: ../backend/lined/build/reports/checkstyle/main.xml
          SPOTBUGS_XML: ../backend/lined/build/reports/spotbugs/spotbugsMain.xml
          JACOCO_XML: ../backend/lined/build/reports/jacoco/test/jacocoTestReport.xml
          SPOTBUGS_HTML: ../backend/lined/build/reports/spotbugs/spotbugsMain.html
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          METRICS_PERSIST: ${{ github.event_name != 'pull_request' }}
          METRICS_OUTPUT_JSON: ${{ github.event_name == 'pull_request' && 'metrics-document.json' || '' }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run metrics

      - name: Upload pull-request metrics document
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-document
          path: fitness-metrics-collector/metrics-document.json
          if-no-files-found: error
          retention-days: 14
