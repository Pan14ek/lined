name: CI backend pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/lined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Run static checks (Checkstyle + SpotBugs + Tests)
        run: ./gradlew check

      - name: Generate code coverage report
        run: ./gradlew jacocoTestReport

      - name: Annotate Checkstyle
        uses: dbelyaev/action-checkstyle@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: backend/lined/config/checkstyle/checkstyle.xml
          workdir: backend/lined
          reporter: github-pr-review

      - name: Generate SpotBugs XML
        run: ./gradlew spotbugsMain

      - name: Build and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonarqube --info -Dsonar.login=$SONAR_TOKEN

      - name: Upload reports (JaCoCo + Checkstyle + SpotBugs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/lined/build/reports/jacoco/**
            backend/lined/build/reports/checkstyle/**
            backend/lined/build/reports/spotbugs/**
            backend/lined/build/jacoco/*.exec
          if-no-files-found: warn
          retention-days: 14

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Upload SpotBugs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/lined/build/reports/spotbugs/spotbugsMain.sarif

      - name: Annotate Checkstyle (XML -> reviewdog)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew checkstyleMain
          reviewdog -f=checkstyle \
            -name="checkstyle" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -fail-on-error=true \
            < build/reports/checkstyle/main.xml

      - name: Install metrics collector deps
        working-directory: fitness-metrics-collector
        run: npm ci

      - name: Debug reports paths
        run: |
          ls -la build/reports/spotbugs || true
          ls -la build/reports/checkstyle || true
          ls -la build/reports/jacoco/test || true

      - name: Debug SpotBugs report
        run: |
          ls -la backend/lined/build/reports/spotbugs || true
          head -n 30 backend/lined/build/reports/spotbugs/spotbugsMain.xml || true

      - name: Collect metrics
        working-directory: fitness-metrics-collector
        env:
          CHECKSTYLE_XML: ../backend/lined/build/reports/checkstyle/main.xml
          SPOTBUGS_XML: ../backend/lined/build/reports/spotbugs/spotbugsMain.xml
          JACOCO_XML: ../backend/lined/build/reports/jacoco/test/jacocoTestReport.xml
        run: npm run metrics