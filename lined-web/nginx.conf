limit_req_zone $binary_remote_addr zone=lined_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lined_ics:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;
map $limit_req_status $edge_retry_after {
    default "";
    REJECTED 1;
}
map $limit_req_status $edge_cache_control {
    default "";
    REJECTED no-store;
}

server {
    listen 80;
    server_name localhost;

    return 302 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/tls/localhost.pem;
    ssl_certificate_key /etc/nginx/tls/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # No URI suffix is intentional: nginx preserves the original /api path.
    location = /api {
        limit_req zone=lined_api burst=40 nodelay;
        add_header Retry-After $edge_retry_after always;
        add_header Cache-Control $edge_cache_control always;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=lined_api burst=40 nodelay;
        add_header Retry-After $edge_retry_after always;
        add_header Cache-Control $edge_cache_control always;
        location ~ ^/api/calendar/feed/ {
            limit_req zone=lined_ics burst=20 nodelay;
            add_header Retry-After $edge_retry_after always;
            add_header Cache-Control $edge_cache_control always;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
